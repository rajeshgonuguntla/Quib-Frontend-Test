name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Lint, types, unit, component, integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  studio:
    name: Studio e2e, visual, accessibility, browsers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium firefox webkit
      - run: npm run e2e
