server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://accounts.google.com https://checkout.stripe.com; script-src 'self' https://accounts.google.com https://apis.google.com https://www.youtube.com https://www.youtube-nocookie.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://accounts.google.com; connect-src 'self' https://*.run.app https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://checkout.stripe.com https://api.stripe.com https://billing.stripe.com https://www.youtube.com https://s.ytimg.com;" always;

    # Same-origin API: cookie cuib_at binds to FE host (first-party on iOS).
    location /api/ {
        proxy_pass https://quib-app-backend-944587700647.europe-west1.run.app;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host quib-app-backend-944587700647.europe-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        client_max_body_size 32m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
