server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://accounts.google.com https://checkout.stripe.com; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://accounts.google.com; connect-src 'self' https://*.run.app https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://checkout.stripe.com https://api.stripe.com https://billing.stripe.com;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
